server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # A types block replaces the whole inherited table, so the standard one must be included explicitly.
    # It does not know the web app manifest, hence the additional mapping.
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    # Revalidate on every load (cheap 304 thanks to ETag) so that a new release is never masked by a stale browser cache
    add_header Cache-Control "no-cache";

    # Vite hashes the file names in /assets/, so they can be cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
