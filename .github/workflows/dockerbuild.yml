name: Build and Push Docker Image

on:
  push:
    branches:
      - '**'
    tags:
      - '*'

jobs:
  # Validate that the web app and the Docker image build on every branch push.
  # This job needs no secret, so it also works on forks.
  build-check:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies and build with Vite
        run: |
          npm install
          npm run build

      - name: Check Docker image build (no push)
        run: docker build -f docker/Dockerfile .

  # Publish the Docker image when a tag (GitHub release) is pushed.
  # The git tag is the single source of truth for the version.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Every build is identified by <tag>-<date>-<time> (UTC). It is used as the image tag and
      # as the app release (hence the service worker cache name), so each build starts with a fresh cache.
      # Only plain x.y.z tags are also published as x.y.z and latest; any other tag
      # (e.g. 1.2.3-rc1) only gets the timestamped image tag and never touches latest.
      - name: Compute version and image tags
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG//\//-}"
          VERSION="${TAG}-$(date -u +%Y%m%d-%H%M)"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/yasl"
          TAGS="${IMAGE}:${VERSION}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAGS="${TAGS}"$'\n'"${IMAGE}:${TAG}"$'\n'"${IMAGE}:latest"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          {
            echo "IMAGE_TAGS<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Install dependencies and build with Vite
        env:
          APP_RELEASE: ${{ env.VERSION }}
        run: |
          npm install
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAGS }}
