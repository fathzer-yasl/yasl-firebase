name: Build and Push Docker Image

on:
  push:
    branches:
      - '**'
    tags:
      - '*'

jobs:
  # Validate that the web app and the Docker image build on every branch push.
  # This job needs no secret, so it also works on forks.
  build-check:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and build with Vite
        run: |
          npm install
          npm run build

      - name: Check Docker image build (no push)
        run: docker build -f docker/Dockerfile .

  # Publish the Docker image when a tag (GitHub release) is pushed.
  # The git tag is the single source of truth for the version.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Install dependencies and build with Vite
        env:
          APP_RELEASE: ${{ env.VERSION }}
        run: |
          npm install
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/yasl:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/yasl:latest
