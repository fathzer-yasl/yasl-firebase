<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YASL</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/dark-mode.css" id="dark-mode-css" disabled />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1976d2" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="YASL" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <script src="/db.js"></script>
</head>
<body>
  <div class="container">
    <div id="top-bar">
      <div class="app-title">YASL</div>
      <div style="margin-left:auto; display:flex; align-items:center;">
        <button id="lists-btn" aria-label="Lists" data-i18n-aria="ariaLists" style="display:none;">
          <span class="lists-icon topbar-icon"></span>
        </button>
        <button id="edit-btn" aria-label="Edit" data-i18n-aria="ariaEditList" style="display:none;">
          <span class="edit-icon topbar-icon"></span>
        </button>
        <button id="settings-btn" aria-label="Settings" data-i18n-aria="ariaSettings">
          <span class="settings-icon topbar-icon"></span>
        </button>
      </div>
    </div>
    <div id="auth-section">
      <button id="sign-in-btn" class="text-btn" data-i18n="signIn">Sign in with Google</button>
    </div>
    <!-- Settings modal dialog -->
    <div id="settings-modal" class="settings-modal" style="display:none;">
      <div class="settings-modal-content">
        <button id="settings-close" aria-label="Close settings" data-i18n-aria="ariaCloseSettings" class="settings-close">&times;</button>
        <div class="settings-card">
          <div class="settings-card-title" data-i18n="settingsTheme">Theme</div>
          <div class="theme-options">
            <label><input type="radio" name="theme" value="light"> <span data-i18n="themeLight">Light</span></label>
            <label><input type="radio" name="theme" value="dark"> <span data-i18n="themeDark">Dark</span></label>
            <label><input type="radio" name="theme" value="system"> <span data-i18n="themeSystem">System</span></label>
          </div>
        </div>
        <div class="settings-card">
          <div class="settings-card-title" data-i18n="settingsLanguage">Language</div>
          <div class="theme-options">
            <label><input type="radio" name="language" value="en"> <span data-i18n="langEnglish">English</span></label>
            <label><input type="radio" name="language" value="fr"> <span data-i18n="langFrench">Français</span></label>
            <label><input type="radio" name="language" value="system"> <span data-i18n="langSystem">System</span></label>
          </div>
        </div>
        <div class="settings-card">
          <div class="settings-card-title" data-i18n="settingsConnection">Connection</div>
          <div id="settings-connection">
            <div id="settings-user-info">
              <span id="user-name"></span>
              <span id="user-email"></span>
            </div>
            <button id="sign-out-btn" aria-label="Sign out" data-i18n-aria="ariaSignOut" class="sign-out-btn">
              <span class="signout-icon"></span>
            </button>
          </div>
        </div>
        <div id="app-version-info"></div>
      </div>
    </div>
    <!-- List of available lists -->
    <div id="lists-panel" style="display:none;">
      <form id="add-list-form">
        <input type="text" id="new-list-name" placeholder="List name..." data-i18n-placeholder="listNamePlaceholder" style="flex:1;" />
        <button id="add-list-btn" type="submit" aria-label="Add list" data-i18n-aria="ariaAddList">
          <span class="plus-icon"></span>
        </button>
      </form>
      <div id="user-lists-container">
        <div id="user-owned-lists-section">
          <div class="lists-title" data-i18n="myLists">My lists</div>
          <div id="user-owned-lists"></div>
        </div>
        <div id ="user-lists-separator">
          <hr>
        </div>
        <div id="user-shared-lists-section" style="margin-top:1.2em;">
          <div class="lists-title" data-i18n="sharedWithMe">Shared with me</div>
          <div id="user-shared-lists"></div>
        </div>
      </div>
    </div>
    <!-- Items list -->
    <div id="main-list-view" style="display:none;">
      <form id="add-item-form">
        <input type="text" id="add-item" placeholder="Add an item..." data-i18n-placeholder="addItemPlaceholder" required />
        <button type="submit" aria-label="Add" data-i18n-aria="ariaAdd">
          <span class="plus-icon"></span>
        </button>
      </form>
      <ul id="item-list"></ul>
    </div>
    <!-- Item removal modal dialog -->
    <div id="remove-modal" class="settings-modal" style="display:none;">
      <div class="settings-modal-content" style="min-width:220px;max-width:90vw;">
        <div class="remove-modal-title"></div>
        <div class="remove-modal-actions">
          <button id="remove-cancel-btn" class="text-btn" type="button" data-i18n="cancel">Cancel</button>
          <button id="remove-confirm-btn" class="text-btn" type="button"></button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
